server:
  port: 8081
  servlet:
    context-path: /food-court

spring:
  datasource:
    url: jdbc:mysql://localhost/PLAZOLETA
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

  cloud:
    compatibility-verifier:
      enabled: false

jwt:
  secret: "clave-super-secreta-cambia-en-prod"
  token-validity: 36000000  # 10 horas en milisegundos

springdoc:
  swagger-ui:
    enabled: true
    persistAuthorization: true

userservice:
  url: http://localhost:8080/food-court/users/api/v1

aws:
  region: us-east-1
  sqs:
    queueUrl: { AWS_QUEUE_URL }
  accessKey: { AWS_ACCESS_KEY }
  secretKey: { AWS_SECRET_KEY }

appDescription: "Plazoleta API"
appVersion: "1.0.0"